<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINO HALL — Онлайн Кинотеатр</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0f1115; color: #fff; min-height: 100vh; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: #161920; border-bottom: 1px solid #222630; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 24px; font-weight: 700; cursor: pointer; }
    .logo span { color: #e50914; }
    .search-box { display: flex; gap: 10px; width: 100%; max-width: 450px; }
    input { width: 100%; padding: 10px 16px; border-radius: 8px; border: 1px solid #2d323f; background: #0f1115; color: #fff; outline: none; }
    button { padding: 10px 20px; border: none; border-radius: 8px; background: #e50914; color: #fff; font-weight: 600; cursor: pointer; }
    .container { padding: 30px 5%; }
    .section-title { margin-bottom: 20px; font-size: 20px; color: #a0a5b5; }
    .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 24px; }
    .movie-card { background: #161920; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid #222630; transition: 0.2s; }
    .movie-card:hover { transform: translateY(-5px); border-color: #3b4152; }
    .movie-card img { width: 100%; height: 270px; object-fit: cover; display: block; }
    .movie-info { padding: 12px; }
    .movie-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .movie-meta { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: #828899; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: #161920; width: 100%; max-width: 900px; border-radius: 16px; overflow: hidden; position: relative; border: 1px solid #2d323f; }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; color: #a0a5b5; cursor: pointer; z-index: 10; }
    .player-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .modal-details { padding: 20px; }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo" id="logoBtn">KINO<span>HALL</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Поиск фильма (например: Такси)...">
      <button id="searchBtn">Найти</button>
    </div>
  </header>

  <main class="container">
    <h2 class="section-title" id="sectionTitle">Каталог фильмов</h2>
    <div id="moviesGrid" class="movies-grid"></div>
  </main>

  <div class="modal" id="movieModal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <div class="player-container">
        <iframe id="playerIframe" src="" allowfullscreen></iframe>
      </div>
      <div class="modal-details">
        <h2 id="modalTitle"></h2>
      </div>
    </div>
  </div>

  <script>
    const moviesGrid = document.getElementById('moviesGrid');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const sectionTitle = document.getElementById('sectionTitle');
    const movieModal = document.getElementById('movieModal');
    const closeModal = document.getElementById('closeModal');
    const playerIframe = document.getElementById('playerIframe');
    const modalTitle = document.getElementById('modalTitle');
    const logoBtn = document.getElementById('logoBtn');

    loadMovies('');

    async function loadMovies(q) {
      moviesGrid.innerHTML = '<p>Загрузка...</p>';
      sectionTitle.textContent = q ? `Результаты поиска: "${q}"` : 'Каталог фильмов';

      try {
        const res = await fetch(`/api?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        displayMovies(data.results || []);
      } catch (err) {
        moviesGrid.innerHTML = '<p style="color: #e50914;">Ошибка загрузки каталога.</p>';
      }
    }

    function displayMovies(movies) {
      moviesGrid.innerHTML = '';
      if (!movies || !movies.length) {
        moviesGrid.innerHTML = '<p>Ничего не найдено в базе.</p>';
        return;
      }

      movies.forEach(m => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <img src="${m.poster}" alt="${m.title}" onerror="this.src='https://via.placeholder.com/500x750/161920/ffffff?text=${encodeURIComponent(m.title)}'">
          <div class="movie-info">
            <div class="movie-title">${m.title}</div>
            <div class="movie-meta">
              <span>${m.year}</span>
            </div>
          </div>
        `;
        card.onclick = () => {
          modalTitle.textContent = m.title;
          // Плеер открывается по прямому Kinopoisk ID
          playerIframe.src = `https://api.strhlp.com/embed/movie/${m.id}`;
          movieModal.style.display = 'flex';
        };
        moviesGrid.appendChild(card);
      });
    }

    closeModal.onclick = () => { movieModal.style.display = 'none'; playerIframe.src = ''; };
    searchBtn.onclick = () => loadMovies(searchInput.value);
    searchInput.onkeypress = (e) => { if (e.key === 'Enter') loadMovies(searchInput.value); };
    logoBtn.onclick = () => { searchInput.value = ''; loadMovies(''); };
  </script>
</body>
</html>
