<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kino-Hall — Поиск фильмов и сериалов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #0f1115;
      color: #fff;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 5%;
      background-color: #161920;
      border-bottom: 1px solid #222630;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .logo span {
      color: #e50914;
    }

    .search-box {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 450px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #2d323f;
      background-color: #0f1115;
      color: #fff;
      outline: none;
      font-size: 15px;
    }

    .search-box input:focus {
      border-color: #e50914;
    }

    .search-box button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #e50914;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-box button:hover {
      background-color: #b80710;
    }

    .container {
      padding: 30px 5%;
    }

    .section-title {
      margin-bottom: 20px;
      font-size: 20px;
      color: #a0a5b5;
    }

    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 24px;
    }

    .movie-card {
      background-color: #161920;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #222630;
    }

    .movie-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      border-color: #3b4152;
    }

    .movie-card img {
      width: 100%;
      height: 270px;
      object-fit: cover;
      display: block;
    }

    .movie-info {
      padding: 12px;
    }

    .movie-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      color: #828899;
    }

    .rating {
      color: #ffc107;
      font-weight: 600;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background-color: #161920;
      width: 100%;
      max-width: 900px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      border: 1px solid #2d323f;
      max-height: 90vh;
      overflow-y: auto;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      color: #a0a5b5;
      cursor: pointer;
      z-index: 10;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: #fff;
    }

    .player-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000;
    }

    .player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .modal-details {
      padding: 24px;
    }

    .modal-title {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .modal-overview {
      font-size: 14px;
      color: #a0a5b5;
      line-height: 1.6;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo" id="logoBtn">KINO<span>HALL</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Поиск фильма (рус, укр, eng)...">
      <button id="searchBtn">Найти</button>
    </div>
  </header>

  <main class="container">
    <h2 class="section-title" id="sectionTitle">Популярное сейчас</h2>
    <div class="movies-grid" id="moviesGrid"></div>
  </main>

  <div class="modal" id="movieModal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <div class="player-container">
        <iframe id="playerIframe" src="" allowfullscreen></iframe>
      </div>
      <div class="modal-details">
        <h2 class="modal-title" id="modalTitle"></h2>
        <p class="modal-overview" id="modalOverview"></p>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = '3fd2be6f0cd0ed1635c61b9333f69e22';
    const API_URL = 'https://api.themoviedb.org/3';
    const IMG_PATH = 'https://image.tmdb.org/t/p/w500';

    const moviesGrid = document.getElementById('moviesGrid');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const sectionTitle = document.getElementById('sectionTitle');
    const logoBtn = document.getElementById('logoBtn');

    const movieModal = document.getElementById('movieModal');
    const closeModal = document.getElementById('closeModal');
    const playerIframe = document.getElementById('playerIframe');
    const modalTitle = document.getElementById('modalTitle');
    const modalOverview = document.getElementById('modalOverview');

    getPopularMovies();

    async function getPopularMovies() {
      try {
        const res = await fetch(`${API_URL}/movie/popular?api_key=${API_KEY}&language=ru-RU&page=1`);
        const data = await res.json();
        
        if (data.status_message) {
          throw new Error(`Ошибка TMDB: ${data.status_message}`);
        }

        sectionTitle.textContent = 'Популярное сейчас';
        displayMovies(data.results || []);
      } catch (err) {
        console.error('Ошибка:', err);
        moviesGrid.innerHTML = `<p style="grid-column: 1/-1; color: #e50914;">${err.message || 'Ошибка загрузки. Проверьте API ключ.'}</p>`;
      }
    }

    async function searchMovies(query) {
      const cleanQuery = query.trim();
      if (!cleanQuery) return;

      moviesGrid.innerHTML = '<p style="grid-column: 1/-1;">Ищем...</p>';

      try {
        // 1. Поиск с русской/украинской локализацией
        let res = await fetch(`${API_URL}/search/multi?api_key=${API_KEY}&language=ru-RU&query=${encodeURIComponent(cleanQuery)}&include_adult=false`);
        let data = await res.json();

        if (data.status_message) {
          throw new Error(`Ошибка TMDB API: ${data.status_message}`);
        }

        let filtered = (data.results || []).filter(item => item.media_type === 'movie' || item.media_type === 'tv');

        // 2. Если по русскому названию ничего не нашло, ищем по международной базе
        if (filtered.length === 0) {
          res = await fetch(`${API_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(cleanQuery)}&include_adult=false`);
          data = await res.json();
          filtered = (data.results || []).filter(item => item.media_type === 'movie' || item.media_type === 'tv');
        }

        sectionTitle.textContent = `Результаты поиска: "${cleanQuery}"`;
        displayMovies(filtered);
      } catch (err) {
        console.error('Ошибка поиска:', err);
        moviesGrid.innerHTML = `<p style="grid-column: 1/-1; color: #e50914;">${err.message || 'Ошибка при выполнении запроса.'}</p>`;
      }
    }

    function displayMovies(movies) {
      moviesGrid.innerHTML = '';

      if (!movies || movies.length === 0) {
        moviesGrid.innerHTML = '<p style="grid-column: 1/-1;">Ничего не найдено :( Попробуйте уточнить название.</p>';
        return;
      }

      movies.forEach(movie => {
        const title = movie.title || movie.name || movie.original_title || 'Без названия';
        const releaseDate = movie.release_date || movie.first_air_date || '';
        const year = releaseDate ? releaseDate.split('-')[0] : '—';
        const rating = movie.vote_average ? movie.vote_average.toFixed(1) : '—';
        const poster = movie.poster_path 
          ? IMG_PATH + movie.poster_path 
          : 'https://via.placeholder.com/500x750/161920/ffffff?text=Нет+обложки';

        const card = document.createElement('div');
        card.classList.add('movie-card');
        card.innerHTML = `
          <img src="${poster}" alt="${title}">
          <div class="movie-info">
            <div class="movie-title" title="${title}">${title}</div>
            <div class="movie-meta">
              <span>${year}</span>
              <span class="rating">★ ${rating}</span>
            </div>
          </div>
        `;

        card.addEventListener('click', () => openMoviePlayer(movie));
        moviesGrid.appendChild(card);
      });
    }

    function openMoviePlayer(movie) {
      const title = movie.title || movie.name || movie.original_title;
      modalTitle.textContent = title;
      modalOverview.textContent = movie.overview || 'Описание фильма пока не добавлено.';

      // Встраиваем плеер Kinobox по TMDB ID
      playerIframe.src = `https://kinobox.in/embed/tmdb-${movie.id}`;
      movieModal.style.display = 'flex';
    }

    closeModal.addEventListener('click', () => {
      movieModal.style.display = 'none';
      playerIframe.src = '';
    });

    window.addEventListener('click', (e) => {
      if (e.target === movieModal) {
        movieModal.style.display = 'none';
        playerIframe.src = '';
      }
    });

    searchBtn.addEventListener('click', () => searchMovies(searchInput.value));
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchMovies(searchInput.value);
    });

    logoBtn.addEventListener('click', () => {
      searchInput.value = '';
      getPopularMovies();
    });
  </script>
</body>
</html>
