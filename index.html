<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kino-Hall — Поиск фильмов и сериалов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #0f1115;
      color: #fff;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 5%;
      background-color: #161920;
      border-bottom: 1px solid #222630;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .logo span {
      color: #e50914;
    }

    .search-box {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 450px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #2d323f;
      background-color: #0f1115;
      color: #fff;
      outline: none;
      font-size: 15px;
    }

    .search-box input:focus {
      border-color: #e50914;
    }

    .search-box button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #e50914;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-box button:hover {
      background-color: #b80710;
    }

    .container {
      padding: 30px 5%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-title {
      margin-bottom: 20px;
      font-size: 20px;
      color: #a0a5b5;
    }

    .player-wrapper {
      width: 100%;
      min-height: 580px;
      background-color: #161920;
      border-radius: 12px;
      border: 1px solid #222630;
      overflow: hidden;
      padding: 10px;
    }
  </style>

  <!-- Подключение официального JS скрипта Kinobox -->
  <script src="https://kinobox.in/kinobox.min.js"></script>
</head>
<body>

  <header class="header">
    <div class="logo" id="logoBtn">KINO<span>HALL</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Поиск фильма (рус, укр, eng)...">
      <button id="searchBtn">Найти</button>
    </div>
  </header>

  <main class="container">
    <h2 class="section-title" id="sectionTitle">Онлайн-плеер</h2>
    <div class="player-wrapper">
      <div class="kinobox_player"></div>
    </div>
  </main>

  <script>
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const sectionTitle = document.getElementById('sectionTitle');
    const logoBtn = document.getElementById('logoBtn');

    function initPlayer(query) {
      const cleanQuery = query.trim();
      if (!cleanQuery) return;

      sectionTitle.textContent = `Поиск фильма: "${cleanQuery}"`;

      // Очищаем предыдущий контейнер
      document.querySelector('.kinobox_player').innerHTML = '';

      // Инициализация виджета
      new Kinobox('.kinobox_player', {
        search: {
          query: cleanQuery
        },
        players: {
          alloha: { enable: true },
          collaps: { enable: true },
          kodik: { enable: true },
          vidsrc: { enable: true }
        }
      }).init();
    }

    // Запуск по умолчанию при открытии страницы
    initPlayer('Омен');

    searchBtn.addEventListener('click', () => initPlayer(searchInput.value));
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') initPlayer(searchInput.value);
    });

    logoBtn.addEventListener('click', () => {
      searchInput.value = '';
      initPlayer('Омен');
    });
  </script>
</body>
</html>
