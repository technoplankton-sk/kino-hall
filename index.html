<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINO HALL — Торрент Кинотеатр</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0f1115; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background-color: #161920; border-bottom: 1px solid #222630; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 24px; font-weight: 700; cursor: pointer; }
    .logo span { color: #e50914; }
    
    .search-box { display: flex; gap: 10px; width: 100%; max-width: 450px; }
    input { width: 100%; padding: 10px 16px; border-radius: 8px; border: 1px solid #2d323f; background-color: #0f1115; color: #fff; outline: none; font-size: 15px; }
    input:focus { border-color: #e50914; }
    button { padding: 10px 20px; border: none; border-radius: 8px; background-color: #e50914; color: #fff; font-weight: 600; cursor: pointer; }
    button:hover { background-color: #b80710; }

    .container { flex: 1; padding: 25px 5%; }
    .section-title { font-size: 18px; color: #a0a5b5; margin-bottom: 20px; }

    .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
    .movie-card { background: #161920; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid #222630; transition: 0.2s; display: flex; flex-direction: column; }
    .movie-card:hover { transform: translateY(-5px); border-color: #e50914; }
    .movie-card img { width: 100%; height: 260px; object-fit: cover; display: block; background: #0f1115; }
    .movie-info { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .movie-title { font-size: 14px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; }
    .movie-year { font-size: 12px; color: #828899; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: #161920; width: 100%; max-width: 900px; border-radius: 16px; overflow: hidden; position: relative; border: 1px solid #2d323f; }
    .close-btn { position: absolute; top: 12px; right: 18px; font-size: 28px; color: #fff; cursor: pointer; z-index: 100; }
    
    .player-header { padding: 15px 20px; background: #0f1115; border-bottom: 1px solid #222630; display: flex; justify-content: space-between; align-items: center; }
    .player-title { font-size: 16px; font-weight: 600; }
    
    .player-box { position: relative; width: 100%; min-height: 480px; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    video { width: 100%; max-height: 500px; outline: none; }

    .status-text { padding: 20px; font-size: 14px; color: #a0a5b5; text-align: center; }
    .progress-bar { width: 80%; height: 6px; background: #222630; border-radius: 3px; overflow: hidden; margin-top: 10px; display: none; }
    .progress-fill { width: 0%; height: 100%; background: #e50914; transition: width 0.3s; }
  </style>

  <!-- WebTorrent библиотека -->
  <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
</head>
<body>

  <header class="header">
    <div class="logo" id="logoBtn">KINO<span>HALL</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Поиск фильма (Очень страшное кино, Такси)...">
      <button id="searchBtn">Найти</button>
    </div>
  </header>

  <main class="container">
    <h2 class="section-title" id="sectionTitle">Каталог фильмов</h2>
    <div class="movies-grid" id="moviesGrid"></div>
  </main>

  <div class="modal" id="movieModal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <div class="player-header">
        <div class="player-title" id="modalTitle">Загрузка видеопотока...</div>
      </div>
      <div class="player-box" id="playerBox">
        <div class="status-text" id="statusText">Инициализация торрент-клиента...</div>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>
  </div>

  <script>
    const client = new WebTorrent();
    const moviesGrid = document.getElementById('moviesGrid');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const sectionTitle = document.getElementById('sectionTitle');
    const movieModal = document.getElementById('movieModal');
    const closeModal = document.getElementById('closeModal');
    const modalTitle = document.getElementById('modalTitle');
    const playerBox = document.getElementById('playerBox');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const logoBtn = document.getElementById('logoBtn');

    searchMovies('Очень страшное кино');

    async function searchMovies(query) {
      const q = query.trim();
      if (!q) return;

      sectionTitle.textContent = `Результаты поиска: "${q}"`;
      moviesGrid.innerHTML = '<p style="color: #a0a5b5;">Поиск по базе Кинопоиска...</p>';

      try {
        const res = await fetch(`https://kinopoiskapiuncensored.net/api/search?query=${encodeURIComponent(q)}`);
        const data = await res.json();
        displayMovies(data.docs || data.results || []);
      } catch (err) {
        moviesGrid.innerHTML = '<p style="color: #e50914;">Ошибка подключения к базе фильмов.</p>';
      }
    }

    function displayMovies(movies) {
      moviesGrid.innerHTML = '';
      if (!movies || !movies.length) {
        moviesGrid.innerHTML = '<p>Ничего не найдено.</p>';
        return;
      }

      movies.forEach(m => {
        const title = m.nameRu || m.title || m.nameEn || 'Без названия';
        const kpId = m.kinopoiskId || m.id;
        const year = m.year || '—';
        const poster = m.posterUrl || m.poster || (kpId ? `https://kinopoiskapiuncensored.net/images/posters/kp/${kpId}.jpg` : 'https://via.placeholder.com/500x750/161920/ffffff?text=Нет+обложки');

        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <img src="${poster}" alt="${title}" onerror="this.src='https://via.placeholder.com/500x750/161920/ffffff?text=${encodeURIComponent(title)}'">
          <div class="movie-info">
            <div class="movie-title">${title}</div>
            <div class="movie-year">${year} г.</div>
          </div>
        `;

        card.onclick = () => openTorrentPlayer(title);
        moviesGrid.appendChild(card);
      });
    }

    function openTorrentPlayer(title) {
      modalTitle.textContent = title;
      movieModal.style.display = 'flex';
      playerBox.innerHTML = `
        <div class="status-text" id="statusText">Поиск раздач и сиров...</div>
        <div class="progress-bar" id="progressBar" style="display:block;"><div class="progress-fill" id="progressFill"></div></div>
      `;

      // Пример проверенной публичной WebTorrent magnet-ссылки
      const torrentId = 'magnet:?xt=urn:btih:08ada5a7a6183aae1e09d831df6748d566095a10&dn=Sintel&tr=wss%3A%2F%2Ftracker.btorrent.xyz&tr=wss%3A%2F%2Ftracker.fastcast.nz&tr=wss%3A%2F%2Ftracker.openwebtorrent.com';

      client.add(torrentId, function (torrent) {
        const file = torrent.files.find(file => file.name.endsWith('.mp4') || file.name.endsWith('.mkv') || file.name.endsWith('.avi'));
        
        if (file) {
          playerBox.innerHTML = '';
          const video = document.createElement('video');
          video.controls = true;
          video.autoplay = true;
          playerBox.appendChild(video);
          
          file.renderTo(video, function (err) {
            if (err) console.log(err);
          });
        } else {
          document.getElementById('statusText').textContent = 'Подходящий видеофайл не найден в раздаче.';
        }
      });
    }

    closeModal.onclick = () => { 
      movieModal.style.display = 'none'; 
      client.torrents.forEach(t => t.destroy());
    };

    searchBtn.onclick = () => searchMovies(searchInput.value);
    searchInput.onkeypress = (e) => { if (e.key === 'Enter') searchMovies(searchInput.value); };
    logoBtn.onclick = () => { searchInput.value = ''; searchMovies('Такси'); };
  </script>
</body>
</html>
