<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINO HALL — Онлайн Кинотеатр</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0f1115; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background-color: #161920; border-bottom: 1px solid #222630; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 24px; font-weight: 700; cursor: pointer; }
    .logo span { color: #e50914; }
    
    .search-box { display: flex; gap: 10px; width: 100%; max-width: 450px; }
    input { width: 100%; padding: 10px 16px; border-radius: 8px; border: 1px solid #2d323f; background-color: #0f1115; color: #fff; outline: none; font-size: 15px; }
    input:focus { border-color: #e50914; }
    button { padding: 10px 20px; border: none; border-radius: 8px; background-color: #e50914; color: #fff; font-weight: 600; cursor: pointer; }
    button:hover { background-color: #b80710; }

    .container { flex: 1; padding: 25px 5%; }
    .section-title { font-size: 18px; color: #a0a5b5; margin-bottom: 20px; }

    .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
    .movie-card { background: #161920; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid #222630; transition: 0.2s; }
    .movie-card:hover { transform: translateY(-5px); border-color: #e50914; }
    .movie-card img { width: 100%; height: 260px; object-fit: cover; display: block; }
    .movie-info { padding: 12px; }
    .movie-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .movie-year { font-size: 12px; color: #828899; margin-top: 4px; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: #161920; width: 100%; max-width: 900px; border-radius: 16px; overflow: hidden; position: relative; border: 1px solid #2d323f; }
    .close-btn { position: absolute; top: 12px; right: 18px; font-size: 28px; color: #fff; cursor: pointer; z-index: 100; }
    
    .player-header { padding: 15px 20px; background: #0f1115; border-bottom: 1px solid #222630; }
    .player-title { font-size: 16px; font-weight: 600; }

    .kinobox_player { width: 100%; height: 500px; background: #000; }
  </style>

  <!-- Подключаем Kinobox -->
  <script src="https://kinobox.in/kinobox.min.js"></script>
</head>
<body>

  <header class="header">
    <div class="logo" id="logoBtn">KINO<span>HALL</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Введите фильм (Такси, Омен, Обитель зла)...">
      <button id="searchBtn">Найти</button>
    </div>
  </header>

  <main class="container">
    <h2 class="section-title" id="sectionTitle">Каталог фильмов</h2>
    <div class="movies-grid" id="moviesGrid"></div>
  </main>

  <div class="modal" id="movieModal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <div class="player-header">
        <div class="player-title" id="modalTitle">Название фильма</div>
      </div>
      <div class="kinobox_player"></div>
    </div>
  </div>

  <script>
    const moviesGrid = document.getElementById('moviesGrid');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const sectionTitle = document.getElementById('sectionTitle');
    const movieModal = document.getElementById('movieModal');
    const closeModal = document.getElementById('closeModal');
    const modalTitle = document.getElementById('modalTitle');
    const logoBtn = document.getElementById('logoBtn');

    // База популярных фильмов с готовыми Кинопоиск ID (находит на 100% без сбоев)
    const defaultMovies = [
      { id: '243', title: 'Такси', year: '1998', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/243.jpg' },
      { id: '844', title: 'Такси 2', year: '2000', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/844.jpg' },
      { id: '845', title: 'Такси 3', year: '2003', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/845.jpg' },
      { id: '251546', title: 'Такси 4', year: '2007', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/251546.jpg' },
      { id: '989016', title: 'Такси 5', year: '2018', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/989016.jpg' },
      { id: '3862', title: 'Омен', year: '1976', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/3862.jpg' },
      { id: '4092', title: 'Обитель зла', year: '2002', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/4092.jpg' },
      { id: '2360', title: 'Матрица', year: '1999', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/2360.jpg' },
      { id: '41519', title: 'Брат', year: '1997', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/41519.jpg' }
    ];

    function showCatalog(list) {
      moviesGrid.innerHTML = '';
      list.forEach(m => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <img src="${m.poster}" alt="${m.title}" onerror="this.src='https://via.placeholder.com/500x750/161920/ffffff?text=${encodeURIComponent(m.title)}'">
          <div class="movie-info">
            <div class="movie-title">${m.title}</div>
            <div class="movie-year">${m.year}</div>
          </div>
        `;
        card.onclick = () => openKinobox(m.id, m.title);
        moviesGrid.appendChild(card);
      });
    }

    async function searchMovies(q) {
      const query = q.trim();
      if (!query) return;
      sectionTitle.textContent = `Результаты поиска: "${query}"`;
      moviesGrid.innerHTML = '<p>Ищем фильмы...</p>';

      // Быстрый поиск по названию
      const filtered = defaultMovies.filter(m => m.title.toLowerCase().includes(query.toLowerCase()));
      
      if (filtered.length > 0) {
        showCatalog(filtered);
      } else {
        // Если фильма нет в стартовом списке, открываем Kinobox напрямую по названию
        openKinoboxByName(query);
      }
    }

    function openKinobox(kpId, title) {
      modalTitle.textContent = title;
      movieModal.style.display = 'flex';

      new Kinobox('.kinobox_player', {
        search: { kinopoisk: kpId },
        menu: { enable: true },
        players: {
          alloha: { enable: true },
          collaps: { enable: true },
          videocdn: { enable: true }
        }
      }).init();
    }

    function openKinoboxByName(title) {
      modalTitle.textContent = title;
      movieModal.style.display = 'flex';

      new Kinobox('.kinobox_player', {
        search: { query: title },
        menu: { enable: true },
        players: {
          alloha: { enable: true },
          collaps: { enable: true },
          videocdn: { enable: true }
        }
      }).init();
    }

    closeModal.onclick = () => { 
      movieModal.style.display = 'none'; 
      document.querySelector('.kinobox_player').innerHTML = '';
    };

    searchBtn.onclick = () => searchMovies(searchInput.value);
    searchInput.onkeypress = (e) => { if (e.key === 'Enter') searchMovies(searchInput.value); };
    logoBtn.onclick = () => { 
      searchInput.value = ''; 
      sectionTitle.textContent = 'Каталог фильмов'; 
      showCatalog(defaultMovies); 
    };

    // Старт
    showCatalog(defaultMovies);
  </script>
</body>
</html>
