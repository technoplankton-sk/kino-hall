<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINO HALL — Онлайн Кинотеатр</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #0f1115;
      color: #fff;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 5%;
      background-color: #161920;
      border-bottom: 1px solid #222630;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .logo span {
      color: #e50914;
    }

    .search-box {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 450px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #2d323f;
      background-color: #0f1115;
      color: #fff;
      outline: none;
      font-size: 15px;
    }

    .search-box input:focus {
      border-color: #e50914;
    }

    .search-box button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #e50914;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-box button:hover {
      background-color: #b80710;
    }

    .container {
      padding: 30px 5%;
    }

    .section-title {
      margin-bottom: 20px;
      font-size: 20px;
      color: #a0a5b5;
    }

    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 24px;
    }

    .movie-card {
      background-color: #161920;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #222630;
    }

    .movie-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      border-color: #3b4152;
    }

    .movie-card img {
      width: 100%;
      height: 270px;
      object-fit: cover;
      display: block;
    }

    .movie-info {
      padding: 12px;
    }

    .movie-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      color: #828899;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background-color: #161920;
      width: 100%;
      max-width: 900px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      border: 1px solid #2d323f;
      max-height: 90vh;
      overflow-y: auto;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      color: #a0a5b5;
      cursor: pointer;
      z-index: 10;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: #fff;
    }

    .player-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000;
    }

    .player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .modal-details {
      padding: 24px;
    }

    .modal-title {
      font-size: 22px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo" id="logoBtn">KINO<span>HALL</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Введите название фильма...">
      <button id="searchBtn">Найти</button>
    </div>
  </header>

  <main class="container">
    <h2 class="section-title" id="sectionTitle">Каталог фильмов</h2>
    <div class="movies-grid" id="moviesGrid"></div>
  </main>

  <div class="modal" id="movieModal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <div class="player-container">
        <iframe id="playerIframe" src="" allowfullscreen></iframe>
      </div>
      <div class="modal-details">
        <h2 class="modal-title" id="modalTitle"></h2>
      </div>
    </div>
  </div>

  <script>
    // Встроенная локальная база популярных фильмов с прямыми ID Кинопоиска
    const localDatabase = [
      { id: '243', title: 'Такси 1', year: '1998', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/243.jpg' },
      { id: '844', title: 'Такси 2', year: '2000', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/844.jpg' },
      { id: '845', title: 'Такси 3', year: '2003', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/845.jpg' },
      { id: '251546', title: 'Такси 4', year: '2007', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/251546.jpg' },
      { id: '989016', title: 'Такси 5', year: '2018', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/989016.jpg' },
      { id: '3862', title: 'Омен', year: '1976', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/3862.jpg' },
      { id: '41519', title: 'Брат', year: '1997', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/41519.jpg' },
      { id: '326', title: 'Побег из Шоушенка', year: '1994', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/326.jpg' },
      { id: '435', title: 'Зеленая миля', year: '1999', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/435.jpg' },
      { id: '448', title: 'Форрест Гамп', year: '1994', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/448.jpg' },
      { id: '361', title: 'Бойцовский клуб', year: '1999', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/361.jpg' },
      { id: '2360', title: 'Матрица', year: '1999', poster: 'https://kinopoiskapiuncensored.net/images/posters/kp/2360.jpg' }
    ];

    const moviesGrid = document.getElementById('moviesGrid');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const sectionTitle = document.getElementById('sectionTitle');
    const logoBtn = document.getElementById('logoBtn');

    const movieModal = document.getElementById('movieModal');
    const closeModal = document.getElementById('closeModal');
    const playerIframe = document.getElementById('playerIframe');
    const modalTitle = document.getElementById('modalTitle');

    // Запуск каталога при загрузке
    displayMovies(localDatabase);

    function filterMovies(query) {
      const cleanQuery = query.trim().toLowerCase();
      if (!cleanQuery) {
        sectionTitle.textContent = 'Каталог фильмов';
        displayMovies(localDatabase);
        return;
      }

      const filtered = localDatabase.filter(m => m.title.toLowerCase().includes(cleanQuery));
      sectionTitle.textContent = `Результаты поиска: "${query}"`;
      displayMovies(filtered);
    }

    function displayMovies(movies) {
      moviesGrid.innerHTML = '';

      if (!movies || movies.length === 0) {
        moviesGrid.innerHTML = '<p style="grid-column: 1/-1;">Ничего не найдено в базе.</p>';
        return;
      }

      movies.forEach(movie => {
        const card = document.createElement('div');
        card.classList.add('movie-card');
        card.innerHTML = `
          <img src="${movie.poster}" alt="${movie.title}" onerror="this.src='https://via.placeholder.com/500x750/161920/ffffff?text=${encodeURIComponent(movie.title)}'">
          <div class="movie-info">
            <div class="movie-title" title="${movie.title}">${movie.title}</div>
            <div class="movie-meta">
              <span>${movie.year}</span>
            </div>
          </div>
        `;

        card.addEventListener('click', () => openMoviePlayer(movie));
        moviesGrid.appendChild(card);
      });
    }

    function openMoviePlayer(movie) {
      modalTitle.textContent = movie.title;

      // Стабильный плеер Voidboost по Kinopoisk ID (без блокировок)
      playerIframe.src = `https://voidboost.net/embed/${movie.id}`;
      movieModal.style.display = 'flex';
    }

    closeModal.addEventListener('click', () => {
      movieModal.style.display = 'none';
      playerIframe.src = '';
    });

    window.addEventListener('click', (e) => {
      if (e.target === movieModal) {
        movieModal.style.display = 'none';
        playerIframe.src = '';
      }
    });

    searchBtn.addEventListener('click', () => filterMovies(searchInput.value));
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') filterMovies(searchInput.value);
    });

    logoBtn.addEventListener('click', () => {
      searchInput.value = '';
      sectionTitle.textContent = 'Каталог фильмов';
      displayMovies(localDatabase);
    });
  </script>
</body>
</html>
