<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINO HALL — Онлайн Кинотеатр</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #0f1115;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 5%;
      background-color: #161920;
      border-bottom: 1px solid #222630;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .logo span {
      color: #e50914;
    }

    .container {
      flex: 1;
      padding: 20px 5%;
      display: flex;
      flex-direction: column;
    }

    .player-wrapper {
      width: 100%;
      flex: 1;
      min-height: 70vh;
      background-color: #161920;
      border-radius: 12px;
      border: 1px solid #222630;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">KINO<span>HALL</span></div>
  </header>

  <main class="container">
    <div class="player-wrapper">
      <!-- Встроенный плеер-каталог с поддержкой поиска и RU/UA озвучки -->
      <iframe src="https://vidsrc.me/" allowfullscreen></iframe>
    </div>
  </main>

</body>
</html>
