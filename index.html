<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINO HALL — Онлайн Кинотеатр</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0f1115; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background-color: #161920; border-bottom: 1px solid #222630; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 24px; font-weight: 700; cursor: pointer; }
    .logo span { color: #e50914; }
    
    .search-box { display: flex; gap: 10px; width: 100%; max-width: 450px; }
    input { width: 100%; padding: 10px 16px; border-radius: 8px; border: 1px solid #2d323f; background-color: #0f1115; color: #fff; outline: none; font-size: 15px; }
    input:focus { border-color: #e50914; }
    button { padding: 10px 20px; border: none; border-radius: 8px; background-color: #e50914; color: #fff; font-weight: 600; cursor: pointer; }
    button:hover { background-color: #b80710; }

    .container { flex: 1; padding: 25px 5%; }
    .section-title { font-size: 18px; color: #a0a5b5; margin-bottom: 20px; }

    .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
    .movie-card { background: #161920; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid #222630; transition: 0.2s; }
    .movie-card:hover { transform: translateY(-5px); border-color: #e50914; }
    .movie-card img { width: 100%; height: 260px; object-fit: cover; display: block; }
    .movie-info { padding: 12px; }
    .movie-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .movie-year { font-size: 12px; color: #828899; margin-top: 4px; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: #161920; width: 100%; max-width: 900px; border-radius: 16px; overflow: hidden; position: relative; border: 1px solid #2d323f; }
    .close-btn { position: absolute; top: 12px; right: 18px; font-size: 28px; color: #fff; cursor: pointer; z-index: 10; }
    
    .player-header { padding: 15px 20px; background: #0f1115; border-bottom: 1px solid #222630; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .player-title { font-size: 16px; font-weight: 600; }
    .servers { display: flex; gap: 8px; }
    .server-btn { padding: 6px 12px; border-radius: 6px; background: #161920; border: 1px solid #2d323f; color: #a0a5b5; font-size: 12px; font-weight: 600; cursor: pointer; }
    .server-btn.active, .server-btn:hover { background: #e50914; color: #fff; border-color: #e50914; }

    .player-box { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
    .player-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo" id="logoBtn">KINO<span>HALL</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Введите название (например: Taxi, Omen)...">
      <button id="searchBtn">Найти</button>
    </div>
  </header>

  <main class="container">
    <h2 class="section-title" id="sectionTitle">Каталог фильмов</h2>
    <div class="movies-grid" id="moviesGrid"></div>
  </main>

  <div class="modal" id="movieModal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <div class="player-header">
        <div class="player-title" id="modalTitle">Название фильма</div>
        <div class="servers">
          <button class="server-btn active" onclick="switchServer(1)">Сервер 1</button>
          <button class="server-btn" onclick="switchServer(2)">Сервер 2</button>
          <button class="server-btn" onclick="switchServer(3)">Сервер 3</button>
        </div>
      </div>
      <div class="player-box">
        <iframe id="playerIframe" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    const OMDB_KEY = 'trilogy';
    const moviesGrid = document.getElementById('moviesGrid');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const sectionTitle = document.getElementById('sectionTitle');
    const movieModal = document.getElementById('movieModal');
    const closeModal = document.getElementById('closeModal');
    const playerIframe = document.getElementById('playerIframe');
    const modalTitle = document.getElementById('modalTitle');
    const logoBtn = document.getElementById('logoBtn');

    let currentImdbId = null;

    async function searchMovies(q) {
      const query = q.trim() || 'Taxi';
      sectionTitle.textContent = `Результаты поиска: "${query}"`;
      moviesGrid.innerHTML = '<p>Загрузка подборки...</p>';

      try {
        const res = await fetch(`https://www.omdbapi.com/?apikey=${OMDB_KEY}&s=${encodeURIComponent(query)}&type=movie`);
        const data = await res.json();

        if (data.Response === 'True' && data.Search) {
          displayMovies(data.Search);
        } else {
          moviesGrid.innerHTML = '<p>Ничего не найдено по этому запросу.</p>';
        }
      } catch (e) {
        moviesGrid.innerHTML = `<p style="color: #e50914;">Ошибка сети: ${e.message}</p>`;
      }
    }

    function displayMovies(movies) {
      moviesGrid.innerHTML = '';

      movies.forEach(m => {
        const title = m.Title;
        const poster = m.Poster !== 'N/A' ? m.Poster : 'https://via.placeholder.com/500x750/161920/ffffff?text=Нет+обложки';
        const year = m.Year || '—';

        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <img src="${poster}" alt="${title}">
          <div class="movie-info">
            <div class="movie-title">${title}</div>
            <div class="movie-year">${year}</div>
          </div>
        `;

        card.onclick = () => openPlayer(m.imdbID, title);
        moviesGrid.appendChild(card);
      });
    }

    function openPlayer(imdbId, title) {
      currentImdbId = imdbId;
      modalTitle.textContent = title;
      switchServer(1);
      movieModal.style.display = 'flex';
    }

    function switchServer(num) {
      document.querySelectorAll('.server-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === num);
      });

      if (num === 1) {
        playerIframe.src = `https://vidsrc.cc/v2/embed/movie/${currentImdbId}`;
      } else if (num === 2) {
        playerIframe.src = `https://embed.su/embed/movie/${currentImdbId}`;
      } else if (num === 3) {
        playerIframe.src = `https://vidsrc.me/embed/movie?imdb=${currentImdbId}`;
      }
    }

    closeModal.onclick = () => { movieModal.style.display = 'none'; playerIframe.src = ''; };
    searchBtn.onclick = () => searchMovies(searchInput.value);
    searchInput.onkeypress = (e) => { if (e.key === 'Enter') searchMovies(searchInput.value); };
    logoBtn.onclick = () => { searchInput.value = ''; searchMovies('Taxi'); };

    // Старт
    searchMovies('Taxi');
  </script>
</body>
</html>
